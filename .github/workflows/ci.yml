name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check public/app.js && node --check public/wallets.js && node --check public/degen.js && node --check public/preservation.js && node --check public/preservation-tools.js && node --check public/turgalium-3d.js && node --check public/turgalium-svg.js
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci && npm run build
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install --upgrade playwright
          python3 -m playwright install --with-deps chromium
      - name: Run Playwright 8-suite E2E regression & safety suite
        env:
          TURGALIUM_E2E_PORT: "4440"
        run: python3 tests/e2e-playwright.py

  foundry-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build Solidity contracts & verify bytecode sizes
        run: forge build --sizes
      - name: Run Foundry unit & fuzz tests
        run: forge test --no-match-contract TurgaliumMainnetFork -vv
      - name: Run Ethereum Mainnet fork tests (when MAINNET_RPC_URL is configured)
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -n "$MAINNET_RPC_URL" ]; then
            forge test --match-contract TurgaliumMainnetFork -vv
          else
            echo "MAINNET_RPC_URL secret not configured; skipping mainnet fork test in CI."
          fi
