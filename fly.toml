# Fly.io deployment manifest for Turgalium Migrator
# Before first deploy:
#   1. fly volumes create turgalium_data --region iad --size 1
#   2. fly secrets set TURGALIUM_ADMIN_SESSION_TOKEN="$(openssl rand -hex 32)"
#   3. fly secrets set TURGALIUM_ALLOWED_HOSTS="turgalium-migrator.fly.dev" TURGALIUM_ALLOWED_ORIGIN="https://turgalium-migrator.fly.dev" TURGALIUM_PUBLIC_BASE_URL="https://turgalium-migrator.fly.dev"

app = "turgalium-migrator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "4420"
  TURGALIUM_DATA_DIR = "/data"
  TURGALIUM_TRUST_PROXY = "true"
  TURGALIUM_REQUIRE_PLUGIN_AUTH = "true"
  TURGALIUM_RATE_LIMIT_MAX = "240"
  TURGALIUM_RATE_LIMIT_WINDOW_MS = "60000"
  TURGALIUM_RPC_COOLDOWN_MS = "60000"

[[mounts]]
  source = "turgalium_data"
  destination = "/data"

[http_service]
  internal_port = 4420
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
